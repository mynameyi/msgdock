[supervisord]
nodaemon=true
user=root
pidfile=/tmp/msgdock-supervisor.pid
logfile=/dev/null
logfile_maxbytes=0

[eventlistener:critical-exit]
command=node /app/deploy/supervisor-events.cjs
events=PROCESS_STATE_FATAL
buffer_size=20
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:postgres]
command=postgres -D %(ENV_PGDATA)s -c listen_addresses=127.0.0.1 -c timezone=%(ENV_TZ)s
user=postgres
priority=10
startsecs=2
autorestart=true
stopwaitsecs=30
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
command=redis-server --bind 127.0.0.1 --protected-mode yes --dir %(ENV_DATA_DIR)s/redis --appendonly yes --maxmemory-policy noeviction
user=redis
priority=10
startsecs=2
autorestart=true
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:api]
command=node /app/deploy/start.cjs api
user=msgdock
directory=/app
priority=20
startsecs=5
autorestart=true
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=node /app/deploy/start.cjs worker
user=msgdock
directory=/app
priority=20
startsecs=5
autorestart=true
stopwaitsecs=35
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
